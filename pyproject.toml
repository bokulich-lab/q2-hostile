[project]
name = "q2-hostile"
authors = [
    { name = "A QIIME 2 Plugin Developer", email = "q2-dev@example.com"}
]
description = "Host read removal with Hostile."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
dynamic = ["version"]
dependencies = [
    "hostile",
]

[project.urls]
Homepage = "https://github.com/bede/hostile"

[project.entry-points.'qiime2.plugins']
"q2-hostile" = "q2_hostile.plugin_setup:plugin"

[build-system]
requires = [
    "setuptools",
    "versioningit",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git-archive"
describe-subst = "$Format:%(describe)$"
default-tag = "0.0.1"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "q2_hostile/_version.py"

[tool.versioningit]
default-version = "0.0.dev0"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["q2_hostile*"]

[tool.setuptools.package-data]
q2_hostile = ["**/*"]
